<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Gempa Terkini (M 5.0+)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header {
            background-color: #144d7e;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h2 { margin: 0; font-size: 18px; }
        header small { font-size: 12px; opacity: 0.85; }
        header button {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            background: #f8f9fa;
            color: #222;
            font-weight: bold;
            cursor: pointer;
        }
        header button:hover { background: #e2e6ea; }
        .container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 350px; overflow-y: auto; border-right: 1px solid #ddd; background: #fff; }
        .gempa-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .gempa-item:hover { background: #f1f6fb; }
        .badge-mag {
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            min-width: 28px;
            text-align: center;
        }
        .gempa-info { font-size: 13px; }
        .gempa-info strong { display: block; margin-bottom: 4px; color: #222; }
        .gempa-info span { color: #666; font-size: 12px; }
        #map { flex: 1; position: relative; }
        .legend {
            background: white;
            padding: 10px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
            font-size: 12px;
            line-height: 1.6;
        }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>15 Gempa Terkini (M 5.0+)</h2>
            <small id="update-time">Memuat data dari BMKG...</small>
        </div>
        <button onclick="loadGempa()">Muat ulang</button>
    </header>

    <div class="container">
        <div id="sidebar"></div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors | Data gempa: <a href="https://data.bmkg.go.id/gempabumi/" target="_blank">BMKG</a>'
        });
        const satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        const map = L.map('map', {
            center: [-2.5, 118.0],
            zoom: 5,
            layers: [osm]
        });

        L.control.layers({ "OpenStreetMap": osm, "Satelit": satelit }).addTo(map);
        L.control.scale({ imperial: false }).addTo(map);

        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <b>Kedalaman</b><br>
                <span class="dot" style="background:#dc3545"></span> Dangkal (< 70 km)<br>
                <span class="dot" style="background:#fd7e14"></span> Menengah (70–300 km)<br>
                <span class="dot" style="background:#198754"></span> Dalam (> 300 km)<br>
                <small>Ukuran lingkaran = magnitudo</small>
            `;
            return div;
        };
        legend.addTo(map);

        let layerGroup = L.layerGroup().addTo(map);

        function getWarnaKedalaman(kedalamanStr) {
            const km = parseFloat(kedalamanStr);
            if (km < 70) return '#dc3545';      // Merah: Dangkal (< 70 km)
            if (km <= 300) return '#fd7e14';    // Oranye: Menengah (70-300 km)
            return '#198754';                   // Hijau: Dalam (> 300 km)
        }

        async function loadGempa() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '<p style="padding:15px;">Mengambil data BMKG...</p>';
            layerGroup.clearLayers();

            try {
                const res = await fetch('https://data.bmkg.go.id/DataMKG/TEWS/gempaterkini.json');
                const data = await res.json();
                const listGempa = data.Infogempa.gempa.slice(0, 15);

                document.getElementById('update-time').innerText =
                    `15 gempa M 5.0+ terakhir • diperbarui ${new Date().toLocaleTimeString('id-ID')}`;
                sidebar.innerHTML = '';

                listGempa.forEach((g, index) => {
                    const [lat, lng] = g.Coordinates.split(',').map(Number);
                    const mag = parseFloat(g.Magnitude);
                    const warna = getWarnaKedalaman(g.Kedalaman);

                    const circle = L.circleMarker([lat, lng], {
                        radius: mag * 2.2,
                        fillColor: warna,
                        color: '#333',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.85
                    }).addTo(layerGroup);

                    circle.bindPopup(`
                        <b>${g.Wilayah}</b><br>
                        Magnitudo: <b>${g.Magnitude}</b><br>
                        Kedalaman: ${g.Kedalaman}<br>
                        Waktu: ${g.Tanggal} ${g.Jam}<br>
                        Potensi: ${g.Potensi}
                    `);

                    const item = document.createElement('div');
                    item.className = 'gempa-item';
                    item.innerHTML = `
                        <div class="badge-mag" style="background:${warna}">${g.Magnitude}</div>
                        <div class="gempa-info">
                            <strong>${g.Wilayah}</strong>
                            <span>${index + 1}. ${g.Tanggal} ${g.Jam} • ${g.Kedalaman}</span>
                        </div>
                    `;
                    item.onclick = () => {
                        map.flyTo([lat, lng], 7);
                        circle.openPopup();
                    };
                    sidebar.appendChild(item);
                });
            } catch (err) {
                sidebar.innerHTML = `<p style="padding:15px;color:red;">Gagal memuat data BMKG: ${err.message}</p>`;
            }
        }

        loadGempa();
    </script>
</body>
</html>
